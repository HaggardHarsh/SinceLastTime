services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sincelasttime
      POSTGRES_PASSWORD: sincelasttime
      POSTGRES_DB: sincelasttime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sincelasttime"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres-data:
