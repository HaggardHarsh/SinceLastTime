services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sincelasttime
      POSTGRES_USER: sincelasttime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sincelasttime"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    image: sincelasttime:local
    build: .
    env_file: .env.production
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  web:
    image: sincelasttime:local
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
  worker:
    image: sincelasttime:local
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  production-postgres:
